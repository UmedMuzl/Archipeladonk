[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emu-loader"
version = "0.1.3"
description = "Cross-platform emulator memory access library for N64 emulators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["emulator", "n64", "memory", "archipelago"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["emu_loader*"]

[tool.setuptools.package-data]
emu_loader = ["emulators.json"]

[project.urls]
Homepage = "https://github.com/Killklli/EmuLoader"

# Anchors pytest's rootdir here so EmuLoader's own tests run standalone, even when this
# package is checked out inside the Archipelago monorepo (whose root pytest.ini would
# otherwise try to import the entire `worlds` tree).
[tool.pytest.ini_options]
testpaths = ["tests"]
